<html>
	<head>
		<title>Cassadie Mefferd - Outdoor Experience Log</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			#header {
				display: none;
			}

			#main {
				margin-left: 0;
				max-width: 100%;
				padding: 3em 3em 2em;
				width: 100%;
				position: relative;
			}

			#footer {
				background-color: #1f1815;
				padding: 3em 1em;
				position: relative;
				text-align: center;
				width: 100%;
			}

			#footer .icons a {
				color: rgba(255, 255, 255, 0.5);
			}

			/* Stage and layout */
			.outdoor-stage {
				position: relative;
				width: 100%;
				min-height: 2400px;
				margin: 1.5em 0 2.5em;
				overflow: visible;
			}

			/* Centered spreadsheet with room on left and right */
			.sheet-container {
				margin: 0 auto;
				width: 60%;
				max-width: 980px;
				min-width: 320px;
				height: 88vh;
				min-height: 840px;
				background: #ffffff;
				border-radius: 10px;
				box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
				position: relative;
				z-index: 5;
				overflow: hidden;
				border: 1px solid rgba(0, 0, 0, 0.08);
			}

			.sheet-container iframe {
				border: 0;
				display: block;
				height: 100%;
				width: 100%;
			}

			/* Drag shield over iframe during drag to prevent pointer capture issues */
			.drag-shield {
				display: none;
				position: absolute;
				inset: 0;
				z-index: 25;
				background: transparent;
			}

			body.is-dragging-active .drag-shield {
				display: block;
			}

			body.is-dragging-active {
				user-select: none;
				-webkit-user-select: none;
			}

			/* Draggable photo items */
			.draggable-photo {
				position: absolute;
				width: clamp(185px, 16vw, 240px);
				cursor: grab;
				touch-action: none;
				user-select: none;
				-webkit-user-select: none;
				z-index: 10;
				transform-origin: center center;
				transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.22s ease;
			}

			.photo-resize-handle {
				position: absolute;
				right: -9px;
				bottom: -9px;
				z-index: 2;
				width: 28px;
				height: 28px;
				padding: 0;
				border: 2px solid #ffffff;
				border-radius: 50%;
				background: #1f1815;
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
				cursor: nwse-resize;
				touch-action: none;
			}

			.photo-resize-handle:before {
				content: '';
				position: absolute;
				inset: 7px;
				border-right: 2px solid #ffffff;
				border-bottom: 2px solid #ffffff;
			}

			.photo-resize-handle:focus-visible {
				outline: 3px solid #49bf9d;
				outline-offset: 2px;
			}

			.draggable-photo.dragging {
				cursor: grabbing !important;
				z-index: 200 !important;
				transform: scale(1.08) rotate(0deg) !important;
				box-shadow: 0 22px 50px rgba(0, 0, 0, 0.45) !important;
				transition: none !important;
			}

			.draggable-photo .image.thumb {
				margin: 0 !important;
				display: block;
				width: 100%;
				border-radius: 0.35em;
				overflow: hidden;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
				transition: box-shadow 0.22s ease;
			}

			.draggable-photo .image.thumb:before {
				background-image: none !important;
				background-color: transparent !important;
				box-shadow: none !important;
				opacity: 0 !important;
				pointer-events: none;
				transition: opacity 0.2s ease-in-out, background-color 0.2s ease-in-out;
			}

			.draggable-photo .image.thumb:after {
				pointer-events: none;
			}

			.draggable-photo img {
				width: 100%;
				height: auto;
				display: block;
				pointer-events: none;
			}

			/* Hover State: Bring to front, grey out with no vignette, show "View" */
			.draggable-photo:hover {
				z-index: 100 !important;
				transform: scale(1.04) rotate(0deg);
			}

			.draggable-photo:hover .image.thumb {
				box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
			}

			.draggable-photo:hover .image.thumb:after {
				opacity: 1.0;
			}

			.draggable-photo:hover .image.thumb:before {
				background-image: none !important;
				box-shadow: none !important;
				background-color: rgba(20, 24, 30, 0.55) !important;
				opacity: 1.0 !important;
			}

			.draggable-photo.dragging .image.thumb:after {
				opacity: 0 !important;
			}

			.draggable-photo.dragging .image.thumb:before {
				opacity: 0 !important;
				background-color: transparent !important;
			}

			/* Photo Lightbox Modal */
			.photo-lightbox {
				position: fixed;
				inset: 0;
				z-index: 99999;
				display: flex;
				align-items: center;
				justify-content: center;
				opacity: 0;
				visibility: hidden;
				transition: opacity 0.25s ease, visibility 0.25s ease;
			}

			.photo-lightbox.is-open {
				opacity: 1;
				visibility: visible;
			}

			.lightbox-backdrop {
				position: absolute;
				inset: 0;
				background: rgba(15, 12, 10, 0.92);
				backdrop-filter: blur(8px);
			}

			.lightbox-container {
				position: relative;
				z-index: 2;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				width: 94vw;
				height: 94vh;
				max-width: 1400px;
			}

			.lightbox-main-view {
				position: relative;
				display: flex;
				align-items: center;
				justify-content: center;
				flex: 1;
				width: 100%;
				max-height: calc(94vh - 130px);
			}

			.lightbox-main-view img {
				max-height: 100%;
				max-width: 100%;
				object-fit: contain;
				border-radius: 6px;
				box-shadow: 0 12px 48px rgba(0, 0, 0, 0.7);
				transition: transform 0.2s ease, opacity 0.2s ease;
			}

			.lightbox-close {
				position: absolute;
				top: 15px;
				right: 20px;
				background: rgba(255, 255, 255, 0.15);
				border: none;
				color: #ffffff;
				font-size: 1.8em;
				width: 48px;
				height: 48px;
				border-radius: 50%;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: background 0.2s ease, transform 0.2s ease;
				z-index: 10;
				line-height: 1;
			}

			.lightbox-close:hover {
				background: rgba(255, 255, 255, 0.35);
				transform: scale(1.08);
			}

			.lightbox-nav {
				position: absolute;
				top: 50%;
				transform: translateY(-50%);
				background: rgba(255, 255, 255, 0.15);
				border: none;
				color: #ffffff;
				font-size: 1.4em;
				width: 52px;
				height: 52px;
				border-radius: 50%;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: background 0.2s ease, transform 0.2s ease;
				z-index: 10;
			}

			.lightbox-nav:hover {
				background: rgba(255, 255, 255, 0.35);
				transform: translateY(-50%) scale(1.08);
			}

			.lightbox-prev {
				left: 20px;
			}

			.lightbox-next {
				right: 20px;
			}

			.lightbox-info {
				display: flex;
				align-items: center;
				justify-content: space-between;
				width: 100%;
				max-width: 800px;
				color: rgba(255, 255, 255, 0.85);
				margin-top: 10px;
				font-size: 0.9em;
			}

			.lightbox-hint {
				font-size: 0.85em;
				color: rgba(255, 255, 255, 0.6);
			}

			.lightbox-thumbs {
				display: flex;
				gap: 12px;
				overflow-x: auto;
				padding: 10px 0;
				max-width: 100%;
				scrollbar-width: thin;
			}

			.lightbox-thumb-item {
				flex: 0 0 68px;
				height: 85px;
				border-radius: 4px;
				overflow: hidden;
				cursor: pointer;
				opacity: 0.5;
				border: 2px solid transparent;
				transition: opacity 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
			}

			.lightbox-thumb-item:hover {
				opacity: 0.85;
				transform: translateY(-2px);
			}

			.lightbox-thumb-item.active {
				opacity: 1;
				border-color: #f2849e;
				transform: scale(1.06);
			}

			.lightbox-thumb-item img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}

			/* Responsive tweaks */
			@media screen and (max-width: 1100px) {
				.sheet-container {
					width: 66%;
				}
				.draggable-photo {
					width: clamp(160px, 18vw, 210px);
				}
			}

			@media screen and (max-width: 768px) {
				#main {
					padding: 2em 1em;
				}
				.outdoor-stage {
					min-height: 2400px;
				}
				.sheet-container {
					width: 94%;
					height: 75vh;
					min-height: 560px;
				}
				.draggable-photo {
					width: 160px;
				}
				.lightbox-nav {
					width: 42px;
					height: 42px;
					font-size: 1.1em;
				}
				.lightbox-prev { left: 5px; }
				.lightbox-next { right: 5px; }
				.lightbox-hint { display: none; }
			}
		</style>
	</head>

								leftPx = cfg.defaultPos.offset;
							} else {
								leftPx = Math.max(0, stageRect.width - photoWidth - cfg.defaultPos.offset);
							}
							el.style.left = leftPx + 'px';
							el.style.top = cfg.defaultPos.top + 'px';
							el.style.transform = `rotate(${cfg.defaultPos.rotate}deg)`;
							el.style.zIndex = 10 + index;
						});
					}

					function loadSavedPositions() {
						try {
							const saved = localStorage.getItem(STORAGE_KEY);
							if (!saved) return false;
							const parsed = JSON.parse(saved);
							if (!parsed || typeof parsed !== 'object') return false;

							applyDefaultPositions();

							photoElements.forEach((el) => {
								const id = el.dataset.id;
								const savedPosition = parsed[id];
								if (savedPosition && typeof savedPosition === 'object') {
									if (savedPosition.left !== undefined) el.style.left = savedPosition.left;
									if (savedPosition.top !== undefined) el.style.top = savedPosition.top;
									if (savedPosition.zIndex) {
										el.style.zIndex = savedPosition.zIndex;
										if (parseInt(savedPosition.zIndex, 10) > highestZIndex) {
											highestZIndex = parseInt(savedPosition.zIndex, 10);
										}
									}
									if (savedPosition.rotate !== undefined) {
										el.style.transform = `rotate(${savedPosition.rotate}deg)`;
									}
									if (Number.isFinite(savedPosition.width) && savedPosition.width > 0) {
										el.style.width = `${savedPosition.width}px`;
									}
								}
							});
							return true;
						} catch (e) {
							console.error('Failed to parse saved positions:', e);
							return false;
						}
					}

					function savePositions() {
						const data = {};
						photoElements.forEach((el, index) => {
							const id = el.dataset.id;
							const cfg = photos[index];
							data[id] = {
								left: el.style.left,
								top: el.style.top,
								zIndex: el.style.zIndex || (10 + index),
								rotate: cfg.defaultPos.rotate,
								width: el.style.width ? el.offsetWidth : null
							};
						});
						localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
					}

					// Drag and Drop
					photoElements.forEach((el, index) => {
						const resizeHandle = document.createElement('button');
						resizeHandle.type = 'button';
						resizeHandle.className = 'photo-resize-handle';
						resizeHandle.setAttribute('aria-label', `Resize ${photos[index].alt}`);
						resizeHandle.setAttribute('aria-keyshortcuts', 'ArrowUp ArrowDown ArrowLeft ArrowRight');
						resizeHandle.title = 'Drag to resize photo';
						el.appendChild(resizeHandle);

						let startX = 0;
						let startY = 0;
						let initialLeft = 0;
						let initialTop = 0;
						let isDragging = false;
						let hasMoved = false;

						el.addEventListener('pointerdown', (e) => {
							if (e.target.closest('.photo-resize-handle')) return;

							// Only react to primary mouse button or touch
							if (e.button !== 0 && e.pointerType === 'mouse') return;

							el.setPointerCapture(e.pointerId);
							startX = e.clientX;
							startY = e.clientY;
							initialLeft = parseFloat(el.style.left) || el.offsetLeft;
							initialTop = parseFloat(el.style.top) || el.offsetTop;
							isDragging = true;
							hasMoved = false;

							highestZIndex += 2;
							el.style.zIndex = highestZIndex;
						});

						el.addEventListener('pointermove', (e) => {
							if (!isDragging) return;

							const dx = e.clientX - startX;
							const dy = e.clientY - startY;

							if (!hasMoved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
								hasMoved = true;
								document.body.classList.add('is-dragging-active');
								el.classList.add('dragging');
							}

							if (hasMoved) {
								const stageRect = stage.getBoundingClientRect();
								const elWidth = el.offsetWidth || 210;
								let newLeft = initialLeft + dx;
								let newTop = initialTop + dy;

								// Keep at least part of the photo visible in the stage
								newLeft = Math.max(-40, Math.min(newLeft, stageRect.width - elWidth + 40));
								newTop = Math.max(-20, Math.min(newTop, stage.offsetHeight - 60));

								el.style.left = newLeft + 'px';
								el.style.top = newTop + 'px';
							}
						});

						const handlePointerUp = (e) => {
							if (!isDragging) return;
							isDragging = false;

							try {
								el.releasePointerCapture(e.pointerId);
							} catch (err) {}

							if (hasMoved) {
								document.body.classList.remove('is-dragging-active');
								el.classList.remove('dragging');
								savePositions();
							} else {
								// Registered as a pure click -> open lightbox!
								openLightbox(index);
							}
						};

						el.addEventListener('pointerup', handlePointerUp);
						el.addEventListener('pointercancel', handlePointerUp);

						let resizeStartX = 0;
						let resizeStartY = 0;
						let initialWidth = 0;
						let isResizing = false;
						let hasResized = false;

						resizeHandle.addEventListener('pointerdown', (e) => {
							if (e.button !== 0 && e.pointerType === 'mouse') return;
							e.preventDefault();
							e.stopPropagation();
							resizeHandle.setPointerCapture(e.pointerId);
							resizeStartX = e.clientX;
							resizeStartY = e.clientY;
							initialWidth = el.offsetWidth;
							isResizing = true;
							hasResized = false;
							highestZIndex += 2;
							el.style.zIndex = highestZIndex;
						});

						resizeHandle.addEventListener('pointermove', (e) => {
							if (!isResizing) return;
							const dx = e.clientX - resizeStartX;
							const dy = e.clientY - resizeStartY;
							const width = Math.max(120, Math.min(480, initialWidth + (dx + dy) / 2));
							el.style.width = `${width}px`;
							hasResized ||= Math.abs(dx) > 2 || Math.abs(dy) > 2;
							if (hasResized) document.body.classList.add('is-dragging-active');
						});

						const finishResize = (e) => {
							if (!isResizing) return;
							isResizing = false;
							try {
								resizeHandle.releasePointerCapture(e.pointerId);
							} catch (err) {}
							document.body.classList.remove('is-dragging-active');
							if (hasResized) savePositions();
						};

						resizeHandle.addEventListener('pointerup', finishResize);
						resizeHandle.addEventListener('pointercancel', finishResize);
						resizeHandle.addEventListener('keydown', (e) => {
							const increase = e.key === 'ArrowUp' || e.key === 'ArrowRight';
							const decrease = e.key === 'ArrowDown' || e.key === 'ArrowLeft';
							if (!increase && !decrease) return;
							e.preventDefault();
							el.style.width = `${Math.max(120, Math.min(480, el.offsetWidth + (increase ? 20 : -20)))}px`;
							savePositions();
						});
					});

					// Lightbox Viewer
					const lightbox = document.getElementById('photoLightbox');
					const lightboxImg = document.getElementById('lightboxImage');
					const currentIdxSpan = document.getElementById('lightboxCurrentIdx');
					const totalCountSpan = document.getElementById('lightboxTotalCount');
					const thumbsContainer = document.getElementById('lightboxThumbs');
					const prevBtn = document.getElementById('lightboxPrev');
					const nextBtn = document.getElementById('lightboxNext');
					const closeBtn = document.getElementById('lightboxClose');
					const backdrop = document.getElementById('lightboxBackdrop');

					let currentPhotoIndex = 0;
					totalCountSpan.textContent = photos.length;

					// Build thumbnails
					photos.forEach((item, idx) => {
						const thumb = document.createElement('div');
						thumb.className = 'lightbox-thumb-item' + (idx === 0 ? ' active' : '');
						thumb.innerHTML = `<img src="${item.thumb || item.src}" alt="${item.alt}" loading="lazy" />`;
						thumb.addEventListener('click', () => {
							showPhoto(idx);
						});
						thumbsContainer.appendChild(thumb);
					});

					function showPhoto(idx) {
						if (idx < 0) idx = photos.length - 1;
						if (idx >= photos.length) idx = 0;
						currentPhotoIndex = idx;

						lightboxImg.style.opacity = '0';
						lightboxImg.style.transform = 'scale(0.96)';

						setTimeout(() => {
							lightboxImg.src = photos[currentPhotoIndex].src;
							lightboxImg.alt = photos[currentPhotoIndex].alt;
							currentIdxSpan.textContent = currentPhotoIndex + 1;

							// Update thumb active state
							const thumbItems = thumbsContainer.querySelectorAll('.lightbox-thumb-item');
							thumbItems.forEach((t, i) => {
								t.classList.toggle('active', i === currentPhotoIndex);
								if (i === currentPhotoIndex) {
									t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
								}
							});

							lightboxImg.style.opacity = '1';
							lightboxImg.style.transform = 'scale(1)';
						}, 120);
					}

					function openLightbox(idx) {
						showPhoto(idx);
						lightbox.classList.add('is-open');
						document.body.style.overflow = 'hidden';
					}

					function closeLightbox() {
						lightbox.classList.remove('is-open');
						document.body.style.overflow = '';
					}

					prevBtn.addEventListener('click', (e) => {
						e.stopPropagation();
						showPhoto(currentPhotoIndex - 1);
					});

					nextBtn.addEventListener('click', (e) => {
						e.stopPropagation();
						showPhoto(currentPhotoIndex + 1);
					});

					closeBtn.addEventListener('click', closeLightbox);
					backdrop.addEventListener('click', closeLightbox);

					// Keyboard navigation
					window.addEventListener('keydown', (e) => {
						if (!lightbox.classList.contains('is-open')) return;
						if (e.key === 'Escape') {
							closeLightbox();
						} else if (e.key === 'ArrowLeft') {
							showPhoto(currentPhotoIndex - 1);
						} else if (e.key === 'ArrowRight') {
							showPhoto(currentPhotoIndex + 1);
						}
					});

					// Mouse wheel scroll to cycle photos ("scroll through all of them")
					let wheelLock = false;
					lightbox.addEventListener('wheel', (e) => {
						e.preventDefault();
						if (wheelLock) return;
						const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
						if (delta > 25) {
							wheelLock = true;
							showPhoto(currentPhotoIndex + 1);
							setTimeout(() => { wheelLock = false; }, 260);
						} else if (delta < -25) {
							wheelLock = true;
							showPhoto(currentPhotoIndex - 1);
							setTimeout(() => { wheelLock = false; }, 260);
						}
					}, { passive: false });

					// Touch swipe support for mobile
					let touchStartX = 0;
					let touchStartY = 0;
					lightbox.addEventListener('touchstart', (e) => {
						touchStartX = e.changedTouches[0].screenX;
						touchStartY = e.changedTouches[0].screenY;
					}, { passive: true });

					lightbox.addEventListener('touchend', (e) => {
						const touchEndX = e.changedTouches[0].screenX;
						const touchEndY = e.changedTouches[0].screenY;
						const dx = touchEndX - touchStartX;
						const dy = touchEndY - touchStartY;
						if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
							if (dx < 0) {
								showPhoto(currentPhotoIndex + 1);
							} else {
								showPhoto(currentPhotoIndex - 1);
							}
						}
					}, { passive: true });

					// Window load & resize handling
					window.addEventListener('DOMContentLoaded', () => {
						if (!loadSavedPositions()) {
							applyDefaultPositions();
						}
					});

					// On window load (images loaded), verify positioning
					window.addEventListener('load', () => {
						if (!loadSavedPositions()) {
							applyDefaultPositions();
						}
					});

					window.addEventListener('resize', () => {
						// Only re-apply defaults if no custom positions were saved
						if (!localStorage.getItem(STORAGE_KEY)) {
							applyDefaultPositions();
						}
					});

				})();
			</script>
	</body>
</html>
